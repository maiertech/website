# yaml-language-server: $schema=https://git.sr.ht/~johnhamelink/hass-json-schema/blob/main/json-schemas/blueprint-automation.json
blueprint:
  name: Basic heating with AC
  description: |
    Keeps a room at 17 °C from 1 October to 31 March while the comfort heating
    switch is off.

    - **Quiet hours start:** turn the AC off if it's in heat.
    - **Room above 19 °C for 5 minutes:** turn the AC off if it's in heat.
    - **Room below 17 °C for 15 minutes:** turn the AC on at 17 °C if it's off.
      This overrides a manual off.
    - **During quiet hours:** the AC never turns on.
    - **Comfort heating switch turns off:** during quiet hours, turn the AC off if
      it's in heat. Otherwise, set the AC to 17 °C if it's in heat.

    Limitation: starting this automation does not turn on the AC if the room is
    already below 17 °C. The AC turns on at the next trigger instead: the room
    stays below 17 °C for 15 minutes after a drop, quiet hours end, Home
    Assistant restarts, or the comfort heating switch turns off.

  source_url: https://maier.tech/blueprints/basic_heating_with_ac.yaml
  domain: automation
  homeassistant:
    min_version: 2026.11.3
  input:
    climate_entity:
      name: AC
      description: Climate entity of the room AC.
      selector:
        entity:
          filter:
            - domain: climate
    comfort_heating_switch:
      name: Comfort heating switch
      description: When on, comfort heating is active.
      selector:
        entity:
          filter:
            - domain: input_boolean
    room_temperature_sensor:
      name: Room temperature sensor
      description: External sensor in the room. Used instead of the AC's own sensor.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    quiet_start:
      name: Quiet hours start
      description: Basic heating pauses from this time.
      default: '22:30:00'
      selector:
        time: {}
    quiet_end:
      name: Quiet hours end
      description: Basic heating resumes at this time.
      default: '06:30:00'
      selector:
        time: {}

conditions:
  # Active during heating season.
  - condition: template
    value_template: '{{ now().month in [10, 11, 12, 1, 2, 3] }}'
  - condition: state
    entity_id: !input comfort_heating_switch
    state: 'off'

triggers:
  - trigger: state
    entity_id: !input comfort_heating_switch
    from: 'on'
    to: 'off'
    id: comfort_heating_switch_off
  # Triggers can't read variables, so these repeat the values in actions.
  - trigger: numeric_state
    entity_id: !input room_temperature_sensor
    above: 19
    for: '00:05:00'
  - trigger: numeric_state
    entity_id: !input room_temperature_sensor
    below: 17
    for: '00:15:00'
  - trigger: time
    at: !input quiet_start
    id: quiet_hours_started
  - trigger: time
    at: !input quiet_end
  - trigger: homeassistant
    event: start

actions:
  - variables:
      room_temperature_sensor: !input room_temperature_sensor
      room_temp: '{{ states(room_temperature_sensor) }}'
      target_temp: 17
      off_temp: 19

  - choose:
      # Quiet hours or warm room: turn off, but only if the AC is in heat.
      - conditions:
          - condition: state
            entity_id: !input climate_entity
            state: heat
          - condition: or
            conditions:
              - condition: trigger
                id: quiet_hours_started
              - condition: and
                conditions:
                  - condition: trigger
                    id: comfort_heating_switch_off
                  - condition: not
                    conditions:
                      - condition: time
                        after: !input quiet_end
                        before: !input quiet_start
              - condition: template
                value_template: '{{ is_number(room_temp) and room_temp | float > off_temp }}'
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: 'off'

      # Comfort heating turned off: basic heating takes over the temperature.
      - conditions:
          - condition: trigger
            id: comfort_heating_switch_off
          - condition: state
            entity_id: !input climate_entity
            state: heat
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: '{{ target_temp }}'

      # Cold room outside quiet hours: heat, but only if the AC is off.
      - conditions:
          - condition: template
            value_template: '{{ is_number(room_temp) and room_temp | float < target_temp }}'
          - condition: state
            entity_id: !input climate_entity
            state: 'off'
          - condition: time
            after: !input quiet_end
            before: !input quiet_start
        sequence:
          # The Toshiba integration ignores hvac_mode in climate.set_temperature.
          - action: climate.set_hvac_mode
            target:
              entity_id: !input climate_entity
            data:
              hvac_mode: heat
          - action: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: '{{ target_temp }}'

mode: queued
